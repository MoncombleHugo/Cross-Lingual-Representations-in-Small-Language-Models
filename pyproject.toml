[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cross-lingual-representations"
version = "0.1.0"
description = "Layer-wise analysis of multilingual representations in small causal language models."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hugo Moncomble" }]
dependencies = [
  "datasets>=3.0,<5",
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<2.3",
  "pandas>=2.2,<4",
  "pyyaml>=6.0,<7",
  "scikit-learn>=1.5,<2",
  "scipy>=1.14,<2",
  "torch>=2.4,<3",
  "tqdm>=4.66,<5",
  "transformers>=5.0,<6",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<10",
  "ruff>=0.6,<1",
  "types-PyYAML>=6.0",
  "types-tqdm>=4.66",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cross_lingual_representations"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["cross_lingual_representations"]

[[tool.mypy.overrides]]
module = ["torch", "torch.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["datasets", "datasets.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.*"]
ignore_missing_imports = true
