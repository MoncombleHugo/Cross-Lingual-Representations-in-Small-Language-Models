experiment_name: smoke
seed: 42
model:
  name: trillionlabs/Tri-0.5B-Base
  revision: null
  device: auto
  dtype: auto
  trust_remote_code: false
dataset:
  name: facebook/flores
  config: all
  train_split: dev
  evaluation_split: devtest
  n_train: 8
  n_eval: 16
  languages:
    en: eng_Latn
    ko: kor_Hang
pooling: [last_token]
batch_size: 2
max_length: 128
representation_dtype: float16
procrustes:
  enabled: true
language_probe:
  enabled: true
  c: 1.0
  max_iter: 2000
tokenization:
  enabled: true
  add_special_tokens: true
